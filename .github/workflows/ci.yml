name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci:
    uses: bigbang1112/workflows/.github/workflows/dotnet-ci.yml@main
    with:
      dotnet-version: 10.0.x
      # The repository root also has docker-compose.dcproj, so the solution has to be named
      restore-args: BigBang1112cz.slnx
      build-args: BigBang1112cz.slnx
      test-args: --solution BigBang1112cz.slnx
